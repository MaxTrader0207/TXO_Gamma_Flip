name: TXO Gamma Flip 長期回測
# 每月自動重跑，也可手動執行：往回抓 N 天的期交所資料逐日計算 GEX／Flip，結果寫到 backtest/（不影響儀表板資料）

on:
  schedule:
    # 每月第一個週六台北 09:30 自動重跑（GitHub 排程可能延遲數小時，月度工作不受影響）
    - cron: "30 1 1-7 * 6"
  workflow_dispatch:
    inputs:
      days:
        description: "往回抓幾個日曆天（留空＝從 2021-10-01 到今天）"
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: txo-data
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 回測
        run: |
          # 排程執行（沒有輸入）時，從 2021-10-01 算到今天，避免把既有的長期資料截短
          DAYS="${{ github.event.inputs.days }}"
          if [ -z "$DAYS" ]; then DAYS=$(( ( $(date +%s) - $(date -d 2021-10-01 +%s) ) / 86400 )); fi
          echo "回測天數 $DAYS"
          python scripts/backtest.py --days "$DAYS"
          python scripts/strategy_bt.py
          python scripts/buyer_bt.py
          python scripts/ma_bt.py
          python scripts/scoreboard.py
          python scripts/night_bt.py
          python scripts/rules2_bt.py
      - name: 提交結果
        run: |
          git config user.name "txo-bot"
          git config user.email "txo-bot@users.noreply.github.com"
          git add backtest data/taiex.json data/holidays_tw.json || git add backtest
          git commit -m "backtest: $(TZ=Asia/Taipei date +%F)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
      - name: 失敗時開 Issue 通知（成功時自動關閉）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
        run: |
          R=${{ github.repository }}
          T="自動執行失敗：${{ github.workflow }}"
          N=$(gh issue list -R "$R" --state open --search "\"$T\" in:title" --json number --jq '.[0].number' || true)
          B="執行紀錄：${{ github.server_url }}/$R/actions/runs/${{ github.run_id }}（台北 $(TZ=Asia/Taipei date '+%F %T')）"
          if [ "$STATUS" = "success" ]; then
            if [ -n "$N" ]; then gh issue close "$N" -R "$R" -c "已恢復正常。$B"; fi
          else
            if [ -n "$N" ]; then gh issue comment "$N" -R "$R" -b "再次失敗。$B"; else gh issue create -R "$R" -t "$T" -b "$B"; fi
          fi
