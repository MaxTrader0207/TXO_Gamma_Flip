name: 更新 TXO Gamma Flip 資料
# 首次執行或 data/history.json 不存在時會自動往回補 45 天

on:
  schedule:
    # 台北時間週一至週五 16:37、17:13、18:07（期交所約 16:15 後公布完整盤後資料）
    - cron: "37 8 * * 1-5"
    - cron: "13 9 * * 1-5"
    - cron: "7 10 * * 1-5"
  workflow_dispatch:
    inputs:
      days:
        description: "往回抓幾個日曆天"
        default: "7"
  push:
    paths:
      - "scripts/txo_gex.py"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: txo-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 抓取期交所資料並計算 Gamma Flip
        run: |
          DAYS="${{ github.event.inputs.days }}"
          if [ -z "$DAYS" ]; then
            if [ -f data/history.json ]; then DAYS=14; else DAYS=45; fi
          fi
          python scripts/txo_gex.py --days "$DAYS"
          python scripts/build_offline.py TXO
      - name: 提交資料
        run: |
          git config user.name "txo-bot"
          git config user.email "txo-bot@users.noreply.github.com"
          git add data offline
          if git diff --cached --quiet; then echo "沒有新資料"; exit 0; fi
          git commit -m "data: TXO $(TZ=Asia/Taipei date +%F)"
          git push
