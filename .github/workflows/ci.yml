name: 測試
# 每次修改程式或頁面就自動跑：資料管線單元測試（固定樣本資料）＋電腦版／手機版頁面冒煙測試

on:
  push:
    paths:
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests pytest
      - name: 資料管線單元測試
        run: pytest -q tests
      - name: 產生頁面
        run: python scripts/build_pages.py
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: 安裝瀏覽器
        run: |
          npm init -y >/dev/null
          npm install playwright@1.47.2 >/dev/null
          npx playwright install --with-deps chromium
      - name: 頁面冒煙測試
        run: node tests/page_smoke.js
